<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Catalogue — XML Lab</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #333; }
    h1 { color: #2c3e50; }
    code { background: #eef1f4; padding: 1px 5px; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px 12px; text-align: left; }
    th { background: #2c3e50; color: #fff; }
    tr:nth-child(even) { background: #f5f7f9; }
    #status { color: #2e7d32; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>📚 Book Catalogue</h1>
  <p>Data source: <code>book.xml</code>, parsed with <code>fetch</code> + <code>DOMParser</code>.</p>
  <div id="book-list">Loading books…</div>
  <p id="status"></p>

  <script>
    // Step 1: fetch book.xml as plain text
    fetch('book.xml')
      .then(function (response) {
        if (!response.ok) {
          throw new Error('Fetch error: ' + response.status);
        }
        return response.text(); // XML files are read as a string via .text()
      })
      .then(function (xmlText) {
        // Step 2: parse the string into a DOM tree with DOMParser
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

        // If the XML is malformed, DOMParser returns a <parsererror> node instead of throwing
        const parseError = xmlDoc.querySelector('parsererror');
        if (parseError) {
          throw new Error('XML parse error: ' + parseError.textContent);
        }

        // Step 3: get all <book> elements and read id / title / author / price
        const books = xmlDoc.getElementsByTagName('book');
        let rows = '';
        for (let i = 0; i < books.length; i++) {
          const book = books[i];
          const id = book.getAttribute('id');
          const title = book.getElementsByTagName('title')[0].textContent;
          const author = book.getElementsByTagName('author')[0].textContent;
          const price = book.getElementsByTagName('price')[0].textContent;

          rows += '<tr>' +
            '<td>' + id + '</td>' +
            '<td>' + title + '</td>' +
            '<td>' + author + '</td>' +
            '<td>$' + price + '</td>' +
            '</tr>';
        }

        // Step 4: write the assembled table into the page
        document.getElementById('book-list').innerHTML =
          '<table>' +
          '<thead><tr><th>ID</th><th>Title</th><th>Author</th><th>Price</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
          '</table>';
        document.getElementById('status').textContent = '✅ Successfully loaded ' + books.length + ' books';
      })
      .catch(function (err) {
        console.error('Fetch error: ' + err.message);
        document.getElementById('book-list').textContent = '❌ Failed to load: ' + err.message;
      });
  </script>
</body>
</html>
